server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Статический экспорт Next: чистые URL и своя страница 404.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Файлы с хэшем в имени неизменяемы — их можно кэшировать навсегда.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Кадры продукта переснимаются вместе с релизом, поэтому кэш короче и с ревалидацией.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Лендинг не встраивается во фреймы и не грузит стороннего кода.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
