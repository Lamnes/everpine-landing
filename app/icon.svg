<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: знак платформы (ель из app-rail) на мятной плашке.
       Плашка, а не прозрачный контур: иконка живёт при 16px, где тонкая линия пропадает,
       а мятное на белой панели вкладок Chrome даёт контраст около 1.8:1 — то есть пятно
       без силуэта. Тёмное по мятному — то же правило контраста, что у primary-кнопок.
       Ель увеличена почти во всю плашку: при 16px ствол шириной 2 единицы из 24 стал бы
       тоньше пикселя и силуэт развалился бы на крону и точку. -->
  <rect width="32" height="32" rx="7" fill="#34D399"/>
  <g transform="translate(1.6 1.6) scale(1.2)">
    <path d="M12 2 5 12h4l-3 5h5v5h2v-5h5l-3-5h4z" fill="#06281b"/>
  </g>
</svg>
